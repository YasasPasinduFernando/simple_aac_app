name: simple_aac_app
description: A simple AAC (Augmentative and Alternative Communication) app
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  flutter_colorpicker: ^1.0.3
  cupertino_icons: ^1.0.2
  
  # Image picker for camera and gallery
  image_picker: ^1.0.4
  image_picker_android: ^0.8.13+10
  image_picker_platform_interface: ^2.11.1
  
  # Text-to-speech
  flutter_tts: ^3.8.3
  
  # For audio recording
  record: ^5.0.1
  audioplayers: ^5.2.0
  
  # Path provider for file storage
  path_provider: ^2.1.1
  
  # Shared preferences
  shared_preferences: ^2.2.2
  
  # Permission handler
  permission_handler: ^11.0.1
  
  # File picker for backup/restore
  file_picker: ^8.0.0
  
  # Zip archive support for backup/restore
  archive: ^3.6.1
  
  # Share backup file
  share_plus: ^10.0.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/images/seed/
    - assets/sounds/

dependency_overrides:
  record_linux: ^1.2.1
  record_platform_interface: ^1.4.0
