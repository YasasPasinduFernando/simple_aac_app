name: simple_aac_app
description: A simple AAC (Augmentative and Alternative Communication) app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  
  # Image picker for camera and gallery
  image_picker: ^1.0.4
  
  # Text-to-speech
  flutter_tts: ^3.8.3
  
  # For audio recording
  record: ^5.0.1
  audioplayers: ^5.2.0
  
  # Path provider for file storage
  path_provider: ^2.1.1
  
  # Shared preferences
  shared_preferences: ^2.2.2
  
  # Permission handler
  permission_handler: ^11.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/sounds/

dependency_overrides:
  record_linux: ^1.2.1
  record_platform_interface: ^1.4.0
