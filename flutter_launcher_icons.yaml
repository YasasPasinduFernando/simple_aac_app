# Copy this file to your Flutter project root, along with assets/branding/.
# flutter pub add --dev flutter_launcher_icons
# dart run flutter_launcher_icons -f flutter_launcher_icons.yaml
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/simple_aac_icon_1024.png"
  adaptive_icon_background: "assets/branding/simple_aac_adaptive_background_432.png"
  adaptive_icon_foreground: "assets/branding/simple_aac_adaptive_foreground_432.png"
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  min_sdk_android: 21
